{% extends "auth/base_auth.html" %}

{% block content %}
<h2 class="font-['Epilogue'] font-bold text-2xl text-tertiary-container mb-1">建立帳號</h2>
<p class="text-on-surface-variant text-sm mb-8">開始你的投資智識之旅</p>

{% if error %}
<div class="flex items-center gap-2 mb-6 px-4 py-3 rounded-xl bg-red-50 border border-red-200">
  <span class="material-symbols-outlined text-error text-base">error</span>
  <p class="text-error text-sm font-medium">{{ error }}</p>
</div>
{% endif %}

<form method="post" action="/signup/" class="space-y-5">
  {% csrf_token %}

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">帳號</label>
    <input
      type="text"
      name="username"
      autocomplete="username"
      required
      class="w-full px-5 py-3.5 bg-surface-container-low border border-outline-variant/40 rounded-full focus:outline-none focus:ring-2 focus:ring-secondary text-on-surface font-body text-sm"
      placeholder="設定帳號名稱"/>
  </div>

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">密碼</label>
    <input
      type="password"
      name="password1"
      autocomplete="new-password"
      required
      class="w-full px-5 py-3.5 bg-surface-container-low border border-outline-variant/40 rounded-full focus:outline-none focus:ring-2 focus:ring-secondary text-on-surface font-body text-sm"
      placeholder="設定密碼（至少 8 個字元）"/>
  </div>

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">確認密碼</label>
    <input
      type="password"
      name="password2"
      autocomplete="new-password"
      required
      class="w-full px-5 py-3.5 bg-surface-container-low border border-outline-variant/40 rounded-full focus:outline-none focus:ring-2 focus:ring-secondary text-on-surface font-body text-sm"
      placeholder="再輸入一次密碼"/>
  </div>

  <button
    type="submit"
    class="w-full py-4 bg-tertiary-container text-white rounded-full font-['Epilogue'] font-bold text-base tracking-wide hover:opacity-90 active:scale-[0.98] transition-all mt-2">
    註冊
  </button>
</form>

<div class="mt-8 pt-6 border-t border-outline-variant/20 text-center">
  <p class="text-on-surface-variant text-sm">
    已有帳號？
    <a href="/login/" class="text-secondary font-bold hover:underline underline-offset-2">立即登入</a>
  </p>
</div>
{% endblock %}
