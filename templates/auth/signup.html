{% extends "auth/base_auth.html" %}

{% block content %}
<h2 class="font-['Epilogue'] font-bold text-2xl text-tertiary-container mb-1">建立帳號</h2>
<p class="text-on-surface-variant text-sm mb-8">開始你的投資智識之旅</p>

{% if error %}
<div class="flex items-center gap-2 mb-6 px-4 py-3 rounded-xl bg-red-50 border border-red-200">
  <span class="material-symbols-outlined text-error text-base">error</span>
  <p class="text-error text-sm font-medium">{{ error }}</p>
</div>
{% endif %}

<form method="post" action="/signup/" class="space-y-5">
  {% csrf_token %}

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">帳號</label>
    <input
      type="text"
      name="username"
      autocomplete="username"
      required
      class="w-full px-5 py-3.5 bg-surface-container-low border border-outline-variant/40 rounded-full focus:outline-none focus:ring-2 focus:ring-secondary text-on-surface font-body text-sm"
      placeholder="設定帳號名稱"/>
  </div>

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">Email（選填）</label>
    <input
      type="email"
      name="email"
      autocomplete="email"
      class="w-full px-5 py-3.5 bg-surface-container-low border border-outline-variant/40 rounded-full focus:outline-none focus:ring-2 focus:ring-secondary text-on-surface font-body text-sm"
      placeholder="you@example.com"/>
  </div>

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">密碼</label>
    <input
      type="password"
      name="password1"
      autocomplete="new-password"
      required
      class="w-full px-5 py-3.5 bg-surface-container-low border border-outline-variant/40 rounded-full focus:outline-none focus:ring-2 focus:ring-secondary text-on-surface font-body text-sm"
      placeholder="設定密碼（至少 8 個字元）"/>
  </div>

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">確認密碼</label>
    <input
      type="password"
      name="password2"
      autocomplete="new-password"
      required
      class="w-full px-5 py-3.5 bg-surface-container-low border border-outline-variant/40 rounded-full focus:outline-none focus:ring-2 focus:ring-secondary text-on-surface font-body text-sm"
      placeholder="再輸入一次密碼"/>
  </div>

  <div class="space-y-1.5">
    <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">大頭貼（選填）</label>
    <div class="flex items-center gap-4">
      <div id="signup-avatar-preview" class="w-16 h-16 rounded-full overflow-hidden bg-surface-container-low border border-outline-variant/40 flex items-center justify-center flex-shrink-0">
        <span class="material-symbols-outlined text-outline text-2xl">person</span>
      </div>
      <label for="signup-avatar-input" class="px-4 py-2 rounded-full border border-outline-variant/40 text-xs font-bold text-secondary cursor-pointer hover:border-secondary/60 transition-all">選擇照片</label>
      <input id="signup-avatar-input" type="file" accept="image/*" class="hidden"/>
    </div>
    <p id="signup-avatar-error" class="hidden text-error text-xs font-medium"></p>
    <input id="signup-avatar-hidden" type="hidden" name="avatar_base64" value=""/>
    <p class="text-outline text-xs">先不選也可以，之後在個人資料頁面隨時能新增照片。</p>
  </div>

  <button
    type="submit"
    class="w-full py-4 bg-tertiary-container text-white rounded-full font-['Epilogue'] font-bold text-base tracking-wide hover:opacity-90 active:scale-[0.98] transition-all mt-2">
    註冊
  </button>
</form>

<div class="mt-8 pt-6 border-t border-outline-variant/20 text-center">
  <p class="text-on-surface-variant text-sm">
    已有帳號？
    <a href="/login/" class="text-secondary font-bold hover:underline underline-offset-2">立即登入</a>
  </p>
</div>

<script>
  (function () {
    var MAX_BYTES = 2 * 1024 * 1024; // 2MB，跟 profile.js 的頭像上傳限制一致
    var input   = document.getElementById('signup-avatar-input');
    var preview = document.getElementById('signup-avatar-preview');
    var hidden  = document.getElementById('signup-avatar-hidden');
    var errEl   = document.getElementById('signup-avatar-error');

    input.addEventListener('change', function (event) {
      errEl.classList.add('hidden');
      var file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        errEl.textContent = '請選擇圖片檔案';
        errEl.classList.remove('hidden');
        event.target.value = '';
        return;
      }
      if (file.size > MAX_BYTES) {
        errEl.textContent = '圖片太大，請選擇 2MB 以內的圖片';
        errEl.classList.remove('hidden');
        event.target.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        hidden.value = reader.result;
        preview.innerHTML = '<img src="' + reader.result + '" class="w-full h-full object-cover"/>';
      };
      reader.readAsDataURL(file);
    });
  })();
</script>
{% endblock %}
