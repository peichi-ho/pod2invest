<!-- ═══════════════════════════════════════════════ PAGE: RANKINGS ═══ -->
<div id="page-rankings" class="page pt-24 px-6 max-w-5xl mx-auto pb-8">
  <section class="mb-10">
    <div class="flex items-start justify-between gap-4">
      <div>
        <div class="inline-block px-3 py-1 rounded-full bg-secondary-container/30 text-secondary font-label text-xs font-bold tracking-widest uppercase mb-4">This Month</div>
        <h2 class="font-['Epilogue'] text-5xl font-bold tracking-tight text-tertiary-container mb-2">Creator Rankings</h2>
        <p id="rankings-subtitle" class="text-secondary font-medium">全部節目 · 依準確率排名</p>
      </div>
      <div class="relative flex-shrink-0 mt-2" id="rankings-filter-container">
        <button onclick="toggleRankingsFilter()" id="rankings-filter-btn"
          class="flex items-center gap-1.5 px-4 py-2 bg-surface-container-high rounded-full text-sm font-semibold text-tertiary-container hover:bg-surface-container-highest transition-colors border border-outline-variant/20">
          <span class="material-symbols-outlined text-base">filter_list</span>
          <span id="rankings-filter-label">全部</span>
          <span class="material-symbols-outlined text-base" id="rankings-filter-chevron">expand_more</span>
        </button>
        <div id="rankings-filter-dropdown" class="hidden absolute right-0 top-full mt-2 bg-[#fcf9f0] rounded-2xl shadow-xl z-50 border border-outline-variant/20 overflow-hidden" style="min-width:190px;">
          <button onclick="applySectorFilter(null)" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors flex items-center gap-2 bg-on-primary-container text-white" id="sector-btn-all">
            <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">leaderboard</span>全部節目
          </button>
          <div class="h-px bg-outline-variant/20"></div>
          <button onclick="applySectorFilter('半導體/電子元件')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">💾 半導體/電子元件</button>
          <button onclick="applySectorFilter('科技類')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">💻 科技類</button>
          <button onclick="applySectorFilter('台股指數')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">📈 台股指數</button>
          <button onclick="applySectorFilter('海外指數')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">🌐 海外指數</button>
          <button onclick="applySectorFilter('大宗商品/外匯')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">🥇 大宗商品/外匯</button>
          <button onclick="applySectorFilter('ETF')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">📦 ETF</button>
          <button onclick="applySectorFilter('能源/電動車')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">⚡ 能源/電動車</button>
          <button onclick="applySectorFilter('其他產業')" class="sector-btn w-full text-left px-4 py-3 text-sm font-semibold text-tertiary-container hover:bg-surface-container-high transition-colors">🏭 其他產業</button>
        </div>
      </div>
    </div>
  </section>

  <section class="mb-10">
    <div id="rankings-podium" class="grid grid-cols-3 gap-2 items-end min-h-[200px]">
      <div class="col-span-3 flex items-center justify-center text-outline text-sm py-12">載入中...</div>
    </div>
  </section>

  <section class="space-y-3">
    <h3 class="font-['Epilogue'] font-bold text-lg text-tertiary-container mb-4">Full Rankings</h3>
    <div id="rankings-full-list" class="space-y-3"></div>
  </section>
</div>
