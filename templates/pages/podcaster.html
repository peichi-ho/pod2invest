<!-- ═══════════════════════════════════════════════ PAGE: PODCASTER ═══ -->
<div id="page-podcaster" class="page pt-20 pb-32 px-6 max-w-5xl mx-auto">
  <button onclick="goBack()" class="flex items-center gap-1 text-secondary font-label text-sm font-semibold mb-6 hover:opacity-70 transition-opacity">
    <span class="material-symbols-outlined text-base">arrow_back_ios</span>返回
  </button>

  <!-- 資訊區：大頭貼在左，節目名稱／集數／準確率／切換按鈕全部排在右邊，跟大頭貼平行 -->
  <section class="flex flex-col sm:flex-row items-center gap-6 sm:gap-10 mb-8">
    <div id="podcaster-avatar" class="w-36 h-36 sm:w-48 sm:h-48 rounded-full overflow-hidden shadow-lg flex-shrink-0">
      <div id="podcaster-avatar-inner" class="w-full h-full flex items-center justify-center [&_.material-symbols-outlined]:text-7xl">
        <span id="podcaster-avatar-icon" class="material-symbols-outlined text-white/80 text-7xl" style="font-variation-settings:'FILL' 1">podcasts</span>
      </div>
    </div>

    <div class="flex-1 min-w-0 flex flex-col items-center sm:items-start text-center sm:text-left">
      <h2 id="podcaster-name" class="font-['Epilogue'] text-3xl sm:text-4xl font-bold tracking-tight text-tertiary-container mb-4">節目名稱</h2>

      <div class="flex flex-wrap justify-center sm:justify-start gap-3 mb-4">
        <div class="px-4 py-1.5 bg-surface-container-low rounded-full text-sm font-bold text-secondary border border-outline-variant/20">
          <span id="podcaster-episode-count">—</span>
        </div>
        <div class="px-4 py-1.5 bg-surface-container-low rounded-full text-sm font-bold text-on-primary-container border border-outline-variant/20">
          <span id="podcaster-accuracy">—</span>
        </div>
      </div>

      <!-- 從 Rankings 套用產業篩選後進來時才顯示，見 rankings.js 的 showPodcaster() -->
      <div id="podcaster-sector-chip" class="hidden inline-flex items-center gap-1.5 px-3 py-1 mb-4 rounded-full bg-on-primary-container/10 text-on-primary-container text-xs font-bold">
        <span class="material-symbols-outlined text-sm">filter_list</span>
        <span id="podcaster-sector-label"></span>
      </div>

      <div class="flex flex-wrap items-center justify-center sm:justify-start gap-4">
        <button id="btn-all-episodes" onclick="switchPodcasterTab('episodes')" class="px-6 py-2.5 bg-tertiary-container text-white rounded-full font-label text-sm font-bold tracking-wide shadow-md transition-all">所有集數</button>
        <button id="btn-all-views" onclick="switchPodcasterTab('views')" class="px-6 py-2.5 bg-surface-container-low text-secondary rounded-full font-label text-sm font-bold tracking-wide border border-secondary/30 transition-all">所有觀點</button>
        <div id="podcaster-favorite-slot" class="w-9 h-9"></div>
      </div>
    </div>
  </section>

  <section id="tab-episodes" class="space-y-3">
    <div id="podcaster-episodes-list" class="space-y-3"></div>
  </section>
  <section id="tab-views" class="space-y-3 hidden">
    <div id="podcaster-views-list" class="space-y-3"></div>
  </section>
</div>
