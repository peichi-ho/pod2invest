<!-- ═══════════════════════════════════════════════ PAGE: PROFILE ═══ -->
<div id="page-profile" class="page pt-24 px-6 max-w-5xl mx-auto space-y-12 pb-8">
  <button onclick="goBack()" class="flex items-center gap-1 text-secondary font-label text-sm font-semibold hover:opacity-70 transition-opacity">
    <span class="material-symbols-outlined text-base">arrow_back_ios</span>返回
  </button>
  <section class="flex flex-col md:flex-row items-center md:items-start gap-8 md:gap-12">
    <div class="relative">
      <div id="profile-avatar-wrap" class="w-32 h-32 md:w-44 md:h-44 rounded-full p-1 bg-gradient-to-br from-on-primary-container to-secondary cursor-pointer" onclick="document.getElementById('avatar-file-input').click()" title="點擊更換照片">
        <div class="w-full h-full rounded-full overflow-hidden bg-surface-container-lowest">
          <div id="profile-avatar-inner" class="w-full h-full flex flex-col items-center justify-center gap-1" style="background:#d97f12">
            <span class="material-symbols-outlined text-white/70 text-3xl" style="font-variation-settings:'FILL' 1">person</span>
          </div>
        </div>
        <div class="absolute bottom-2 right-2 w-9 h-9 rounded-full bg-tertiary-container border-2 border-surface flex items-center justify-center shadow-md pointer-events-none">
          <span class="material-symbols-outlined text-white text-base">photo_camera</span>
        </div>
      </div>
      <input id="avatar-file-input" type="file" accept="image/*" class="hidden" onchange="onAvatarFileSelected(event)"/>
      <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-tertiary-container text-on-tertiary px-4 py-1.5 rounded-full text-[10px] font-['Epilogue'] font-bold uppercase tracking-widest whitespace-nowrap shadow-lg">Premium Curator</div>
    </div>
    <div class="flex-1 text-center md:text-left space-y-4">
      <h2 id="profile-username" class="font-['Epilogue'] font-extrabold text-4xl md:text-6xl text-tertiary-container tracking-tight">載入中...</h2>
      <div class="flex flex-wrap justify-center md:justify-start gap-3 pt-2">
        <span id="profile-joined" class="px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-sm font-semibold"></span>
        <button onclick="openEditProfileModal()" class="px-6 py-2 rounded-full bg-on-primary-container text-white font-['Epilogue'] text-xs font-bold uppercase tracking-widest hover:opacity-90 transition-all active:scale-95">Edit Profile</button>
      </div>
    </div>
  </section>

  <section class="space-y-6">
    <div class="flex items-center gap-3">
      <button onclick="openProfileListModal('history')" class="flex items-center gap-1 text-secondary font-bold text-sm hover:underline flex-shrink-0">
        <span class="material-symbols-outlined text-base">list</span>顯示全部
      </button>
      <h3 class="font-['Epilogue'] font-bold text-2xl text-tertiary-container">觀看紀錄</h3>
    </div>
    <div id="history-scroll" class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
      <p class="text-outline text-sm">載入中...</p>
    </div>
  </section>

  <section class="space-y-6">
    <div class="flex justify-between items-end">
      <div class="flex items-center gap-2">
        <h3 class="font-['Epilogue'] font-bold text-2xl text-tertiary-container">個人偏好設定</h3>
        <button id="prefs-edit-btn" onclick="togglePrefsEditMode()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-secondary" title="編輯偏好">
          <span class="material-symbols-outlined text-lg">edit</span>
        </button>
      </div>
      <button id="prefs-save-btn" onclick="savePreferences()" class="hidden px-5 py-2 rounded-full bg-on-primary-container text-white font-label text-xs font-bold uppercase tracking-widest hover:opacity-90 transition-all active:scale-95">儲存</button>
    </div>

    <div id="prefs-groups" class="space-y-4"><p class="text-outline text-sm">載入中...</p></div>

    <p id="pref-saved-msg" class="text-secondary text-sm font-semibold hidden text-center">✓ 偏好已儲存，下次推薦將依此調整</p>
  </section>

  <section class="grid grid-cols-1 lg:grid-cols-2 gap-12">
    <div class="space-y-6">
      <div class="flex justify-between items-end">
        <h3 class="font-['Epilogue'] font-bold text-2xl text-tertiary-container">你的單集</h3>
        <button onclick="openProfileListModal('episodes')" class="text-secondary font-bold text-sm hover:underline">查看全部</button>
      </div>
      <div id="saved-episodes-list" class="space-y-4"><p class="text-outline text-sm">載入中...</p></div>
    </div>
    <div class="space-y-6">
      <div class="flex justify-between items-end">
        <h3 class="font-['Epilogue'] font-bold text-2xl text-tertiary-container">最愛 Podcast</h3>
        <button onclick="openProfileListModal('podcasts')" class="text-secondary font-bold text-sm hover:underline">查看全部</button>
      </div>
      <div id="favorite-podcasts-list" class="space-y-3"><p class="text-outline text-sm">載入中...</p></div>
    </div>
  </section>

  <section class="space-y-6 pb-12">
    <h3 class="font-['Epilogue'] font-bold text-2xl text-tertiary-container">Settings</h3>
    <form method="post" action="/logout/">
      {% csrf_token %}
      <button type="submit" class="w-full flex items-center justify-between p-6 bg-surface-container-lowest rounded-lg border border-outline-variant/10 hover:bg-error-container/20 transition-all group">
        <div class="flex items-center gap-4"><span class="material-symbols-outlined text-error">logout</span><span class="font-['Epilogue'] font-bold text-error">Logout</span></div>
        <span class="material-symbols-outlined text-error opacity-0 group-hover:opacity-100 transition-all">power_settings_new</span>
      </button>
    </form>
  </section>
</div>

<!-- Edit Profile modal -->
<div id="edit-profile-modal" class="hidden fixed inset-0 z-[70] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeEditProfileModal()">
  <div class="bg-surface w-full max-w-md rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/20 sticky top-0 bg-surface">
      <h3 class="font-['Epilogue'] font-bold text-lg text-tertiary-container">編輯個人資料</h3>
      <button onclick="closeEditProfileModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined text-outline">close</span>
      </button>
    </div>
    <div class="px-6 py-5 space-y-5">
      <div class="space-y-1.5">
        <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">姓名</label>
        <input id="edit-username" type="text" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl focus:outline-none focus:ring-2 focus:ring-secondary text-sm"/>
      </div>
      <div class="space-y-1.5">
        <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">Email</label>
        <input id="edit-email" type="email" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl focus:outline-none focus:ring-2 focus:ring-secondary text-sm"/>
      </div>
      <p id="edit-profile-error" class="hidden text-error text-xs font-semibold"></p>
      <p id="edit-profile-success" class="hidden text-secondary text-xs font-semibold">✓ 已更新</p>
      <button onclick="saveProfileInfo()" class="w-full py-3 bg-on-primary-container text-white rounded-full font-['Epilogue'] font-bold text-sm hover:opacity-90 transition-all active:scale-95">儲存變更</button>

      <div class="pt-4 border-t border-outline-variant/20 space-y-4">
        <h4 class="font-['Epilogue'] font-bold text-sm text-tertiary-container">變更密碼</h4>
        <div class="space-y-1.5">
          <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">原密碼</label>
          <input id="edit-old-password" type="password" autocomplete="current-password" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl focus:outline-none focus:ring-2 focus:ring-secondary text-sm"/>
        </div>
        <div class="space-y-1.5">
          <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">新密碼</label>
          <input id="edit-new-password" type="password" autocomplete="new-password" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl focus:outline-none focus:ring-2 focus:ring-secondary text-sm" placeholder="至少 8 個字元"/>
        </div>
        <div class="space-y-1.5">
          <label class="font-['Manrope'] text-xs font-bold uppercase tracking-widest text-outline">確認新密碼</label>
          <input id="edit-new-password2" type="password" autocomplete="new-password" class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl focus:outline-none focus:ring-2 focus:ring-secondary text-sm"/>
        </div>
        <p id="edit-password-error" class="hidden text-error text-xs font-semibold"></p>
        <p id="edit-password-success" class="hidden text-secondary text-xs font-semibold">✓ 密碼已更新</p>
        <button onclick="changePassword()" class="w-full py-3 border-2 border-secondary text-secondary rounded-full font-['Epilogue'] font-bold text-sm hover:bg-secondary hover:text-white transition-all active:scale-95">更新密碼</button>
      </div>
    </div>
  </div>
</div>

<!-- 顯示全部 / 查看全部 共用彈窗（觀看紀錄／收藏單集／最愛 Podcast）-->
<div id="profile-list-modal" class="hidden fixed inset-0 z-[70] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) closeProfileListModal()">
  <div class="bg-surface w-full max-w-lg rounded-2xl shadow-2xl max-h-[80vh] flex flex-col">
    <div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/20 flex-shrink-0">
      <h3 id="profile-list-modal-title" class="font-['Epilogue'] font-bold text-lg text-tertiary-container"></h3>
      <button onclick="closeProfileListModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined text-outline">close</span>
      </button>
    </div>
    <div id="profile-list-modal-body" class="px-6 py-4 overflow-y-auto space-y-3 flex-1"></div>
  </div>
</div>
