<!-- ═══════════════════════════════════════════════ PAGE: GRAPH (個股走勢圖) ═══ -->
<div id="page-graph" class="page pt-24 px-6 max-w-5xl mx-auto pb-8">
  <button onclick="goBack()" class="flex items-center gap-1 text-secondary font-label text-sm font-semibold mb-6 hover:opacity-70 transition-opacity">
    <span class="material-symbols-outlined text-base">arrow_back_ios</span>返回
  </button>

  <div class="bg-surface-container-lowest rounded-lg p-8 flex flex-col" style="min-height:520px;">
    <div class="flex flex-wrap items-start justify-between gap-4 mb-8">
      <div>
        <h3 class="font-['Epilogue'] text-2xl font-bold text-tertiary-container">個股趨勢圖</h3>
        <p id="stock-chart-subtitle" class="text-outline font-medium">查詢個股後顯示走勢</p>
      </div>
      <div class="flex gap-1 bg-surface-container-high rounded-full p-1">
        <button onclick="setStockPeriod('1mo')" data-period="1mo" class="stock-period-btn px-3 py-1.5 rounded-full font-label text-xs font-bold transition-all text-secondary">1月</button>
        <button onclick="setStockPeriod('3mo')" data-period="3mo" class="stock-period-btn px-3 py-1.5 rounded-full font-label text-xs font-bold transition-all text-secondary">3月</button>
        <button onclick="setStockPeriod('6mo')" data-period="6mo" class="stock-period-btn px-3 py-1.5 rounded-full font-label text-xs font-bold transition-all text-secondary">6月</button>
        <button onclick="setStockPeriod('1y')"  data-period="1y"  class="stock-period-btn px-3 py-1.5 rounded-full font-label text-xs font-bold transition-all bg-tertiary-container text-white">1年</button>
      </div>
    </div>
    <div class="flex-grow relative flex items-center justify-center" style="min-height:300px;">
      <p id="stock-chart-placeholder" class="text-outline text-sm">查詢個股後顯示走勢圖</p>
      <svg id="stock-svg" class="w-full h-full hidden" viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="stock-info" class="hidden mt-5 pt-4 border-t border-outline-variant/20 flex gap-8">
      <div><div class="text-xs text-outline font-bold uppercase tracking-widest mb-1">股票</div><div id="stock-name" class="font-['Epilogue'] font-bold text-tertiary-container text-lg"></div></div>
      <div><div class="text-xs text-outline font-bold uppercase tracking-widest mb-1">最新收盤</div><div id="stock-last-price" class="font-['Epilogue'] font-bold text-tertiary-container text-lg"></div></div>
      <div><div class="text-xs text-outline font-bold uppercase tracking-widest mb-1">區間漲跌</div><div id="stock-change" class="font-['Epilogue'] font-bold text-lg"></div></div>
      <div><div class="text-xs text-outline font-bold uppercase tracking-widest mb-1">歷史年化報酬</div><div id="stock-hist-return" class="font-['Epilogue'] font-bold text-lg"></div></div>
    </div>
    <p id="stock-data-asof" class="mt-2 text-xs text-outline"></p>
    <div id="stock-news-section" class="hidden mt-5 pt-4 border-t border-outline-variant/20">
      <div class="text-xs text-outline font-bold uppercase tracking-widest mb-3">相關新聞</div>
      <div id="stock-news-list" class="space-y-2"></div>
    </div>
  </div>
</div>
