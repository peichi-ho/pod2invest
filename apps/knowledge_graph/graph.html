<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & 半導體產業鏈動態供應關係圖</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
        }

        #chart-container {
            width: 100vw;
            height: 100vh;
        }

        /* 節點樣式 */
        .node circle {
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
            transition: r 0.2s ease;
        }

        .node text {
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            fill: #eee;
            text-shadow: 1px 1px 2px #000;
        }

        /* 連線樣式 */
        .link {
            fill: none;
            stroke-opacity: 0.6;
            /* stroke-width 改由程式動態設定 */
            transition: stroke-opacity 0.3s, stroke-width 0.3s, stroke 0.3s;
        }

        /* 連線感應區 (Hitbox) */
        .link-hitbox {
            fill: none;
            stroke: transparent;
            stroke-width: 20px; /* 稍微加粗感應區方便滑鼠懸停 */
            cursor: help;
        }

        /* Tooltip 樣式 (共用給節點與連線) */
        #tooltip {
            position: absolute;
            padding: 12px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #555;
            border-radius: 6px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: none;
            z-index: 100;
            max-width: 300px;
        }

        .tooltip-title {
            font-weight: bold;
            color: #4db8ff;
            margin-bottom: 8px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            font-size: 15px;
        }
        
        .reason-list {
            margin: 0;
            padding-left: 20px;
            color: #ddd;
        }

        /* 當滑鼠移過連線群組時的高亮效果 */
        .link-group:hover .link {
            stroke-opacity: 1 !important;
            stroke: #fff !important; /* 滑過時變白高亮 */
        }

        /* 圖例樣式 */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            border: 1px solid #444;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            margin-right: 10px;
            border-radius: 3px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="loading">正在載入圖譜資料...</div>
    <div id="tooltip"></div>
    <div id="chart-container"></div>

    <div class="legend">
        <div style="font-weight: bold; margin-bottom: 10px; color:#aaa;">關係類型 (連線粗細代表提及次數)</div>
        <div class="legend-item"><div class="legend-color" style="background: #4CAF50;"></div>供應 (Supply)</div>
        <div class="legend-item"><div class="legend-color" style="background: #F44336;"></div>替代競爭 (Substitution)</div>
        <div class="legend-item"><div class="legend-color" style="background: #2196F3;"></div>趨勢共生 (Co-impact)</div>
    </div>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        // 使用 industry 做為顏色的基準
        const colorScale = d3.scaleOrdinal(d3.schemeTableau10);
        
        const relationColors = {
            "Supply": "#4CAF50",
            "Substitution": "#F44336",
            "Co-impact": "#2196F3",
            "Unknown": "#999999"
        };

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g");
        
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);

        // 讀取外部 JSON 檔案
        d3.json("d3_ready_graph.json").then(function(data) {
            
            // 隱藏載入提示
            d3.select("#loading").style("display", "none");

            // 確保有資料才繪圖
            if (!data.nodes || data.nodes.length === 0) {
                alert("沒有找到符合條件的圖譜資料！");
                return;
            }

            // 定義箭頭 (Markers)
            svg.append("defs").selectAll("marker")
                .data(["Supply", "Substitution", "Co-impact", "Unknown"])
                .enter().append("marker")
                .attr("id", d => `marker-${d}`)
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 28) // 箭頭推遠一點，避免被變大的節點蓋住
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("fill", d => relationColors[d] || relationColors["Unknown"])
                .attr("d", "M0,-5L10,0L0,5");

            // 物理力引擎
            const simulation = d3.forceSimulation(data.nodes)
                .force("link", d3.forceLink(data.links).id(d => d.id).distance(250)) // 拉開節點距離
                .force("charge", d3.forceManyBody().strength(-800))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(60))
                .force("x", d3.forceX(width / 2).strength(0.05))
                .force("y", d3.forceY(height / 2).strength(0.05));

            // 繪製連線組
            const linkGroup = g.append("g")
                .selectAll(".link-group")
                .data(data.links)
                .enter().append("g")
                .attr("class", "link-group")
                // 加入連線的 Tooltip 事件
                .on("mouseover", showLinkTooltip)
                .on("mouseout", hideTooltip);

            // 實體連線 (根據 weight 決定粗細)
            const link = linkGroup.append("line")
                .attr("class", "link")
                .attr("stroke", d => relationColors[d.relation_type] || relationColors["Unknown"])
                .attr("stroke-width", d => Math.max(2, (d.weight || 1) * 2)) // 權重越大線越粗，最低 2px
                .attr("marker-end", d => `url(#marker-${d.relation_type})`);

            // 透明的連線感應區
            const linkHitbox = linkGroup.append("line")
                .attr("class", "link-hitbox");

            // 繪製節點
            const node = g.append("g")
                .selectAll(".node")
                .data(data.nodes)
                .enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            // 節點圓圈 (大小稍微加大，顏色綁定 industry)
            node.append("circle")
                .attr("r", 22)
                .attr("fill", d => colorScale(d.industry || "未分類"))
                .on("mouseover", showNodeTooltip)
                .on("mouseout", hideTooltip);

            // 節點文字 (使用 d.id 作為名稱)
            node.append("text")
                .attr("dy", 40)
                .attr("text-anchor", "middle")
                .text(d => d.id);

            // Tick 更新
            simulation.on("tick", () => {
                const radius = 30;
                data.nodes.forEach(d => {
                    d.x = Math.max(radius, Math.min(width - radius, d.x));
                    d.y = Math.max(radius, Math.min(height - radius, d.y));
                });

                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                linkHitbox
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            // --- 互動功能區塊 ---
            const tooltip = d3.select("#tooltip");

            // 節點 Tooltip
            function showNodeTooltip(event, d) {
                d3.select(this).transition().duration(200).attr("r", 28);
                tooltip.style("display", "block")
                    .html(`
                        <div class="tooltip-title">${d.id}</div>
                        <div><b>所屬產業：</b> <span style="color:${colorScale(d.industry)}">${d.industry}</span></div>
                    `);
            }

            // 連線 Tooltip (展開我們用 LLM 整理的 reasons 清單)
            function showLinkTooltip(event, d) {
                // 將 reasons 陣列轉換成 HTML 清單 (li)
                let reasonsHtml = "";
                if (d.reasons && d.reasons.length > 0) {
                    reasonsHtml = `<ul class="reason-list">` + 
                                  d.reasons.map(r => `<li>${r}</li>`).join("") + 
                                  `</ul>`;
                } else {
                    reasonsHtml = `<div style="color:#aaa;">無詳細敘述</div>`;
                }

                tooltip.style("display", "block")
                    .html(`
                        <div class="tooltip-title">${d.source.id} ➔ ${d.target.id}</div>
                        <div style="margin-bottom:5px;"><b>關係：</b> <span style="color:${relationColors[d.relation_type]}">${d.relation_type}</span></div>
                        <div style="margin-bottom:5px;"><b>提及次數 (熱度)：</b> ${d.weight} 次</div>
                        <div><b>關聯事件：</b></div>
                        ${reasonsHtml}
                    `);
            }

            function hideTooltip() {
                // 將節點恢復原本大小
                d3.selectAll(".node circle").transition().duration(200).attr("r", 22);
                tooltip.style("display", "none");
            }

            // 讓 Tooltip 跟隨滑鼠
            svg.on("mousemove", (event) => {
                // 加上一點偏移量，避免游標擋住 Tooltip
                tooltip.style("left", (event.pageX + 20) + "px")
                       .style("top", (event.pageY - 20) + "px");
            });

            // 拖曳功能
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

        }).catch(function(error){
            console.error("載入 JSON 失敗:", error);
            d3.select("#loading").text("載入資料失敗，請確認 d3_ready_graph.json 是否存在且格式正確。").style("color", "red");
        });

        // 視窗縮放適應
        window.addEventListener('resize', () => {
            svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
            // 注意：重新啟動 simulation 需要確保它已被初始化，這裡假設不頻繁 resize
        });

    </script>
</body>
</html>
