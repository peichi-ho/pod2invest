<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主張與推理分析</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #141414;
            color: #e0e0e0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 頂部 ── */
        #topbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 24px;
            background: rgba(8,8,8,0.96);
            border-bottom: 1px solid #1e1e1e;
            backdrop-filter: blur(6px);
        }
        #topbar h1 { font-size: 15px; font-weight: bold; color: #fff; white-space: nowrap; }

        #episode-select {
            flex: 1; max-width: 520px;
            background: #1c1c1c; border: 1px solid #2e2e2e; border-radius: 7px;
            color: #e0e0e0; font-size: 13px; padding: 6px 10px;
            outline: none; cursor: pointer;
        }
        #episode-select:focus { border-color: #4db8ff; }

        #btn-analyze {
            padding: 7px 22px;
            background: #1a6fb5; border: none; border-radius: 7px;
            color: #fff; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: background 0.2s; white-space: nowrap;
        }
        #btn-analyze:hover    { background: #2585d4; }
        #btn-analyze:disabled { background: #222; color: #444; cursor: not-allowed; }

        #status-msg { font-size: 12px; color: #444; white-space: nowrap; margin-left: auto; }

        /* ── 主體 ── */
        #main {
            flex: 1; overflow-y: auto; padding: 28px 36px;
            scrollbar-width: thin; scrollbar-color: #252525 transparent;
        }
        #main::-webkit-scrollbar { width: 5px; }
        #main::-webkit-scrollbar-thumb { background: #252525; border-radius: 3px; }

        /* ── Placeholder ── */
        #placeholder {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 55vh;
            color: #2e2e2e; font-size: 14px; gap: 10px; user-select: none;
        }
        #placeholder .icon { font-size: 44px; }

        /* ── 集數標題 ── */
        #episode-header { display: none; margin-bottom: 26px; }
        #episode-header.visible { display: block; }
        #episode-title  { font-size: 18px; font-weight: bold; color: #f0f0f0; margin-bottom: 4px; }
        #episode-meta   { font-size: 12px; color: #484848; }

        /* ── 錯誤 ── */
        #error-msg {
            display: none;
            background: rgba(244,67,54,0.08); border: 1px solid rgba(244,67,54,0.22);
            border-radius: 8px; padding: 12px 16px; color: #ef5350;
            font-size: 13px; margin-bottom: 20px;
        }
        #error-msg.visible { display: block; }

        /* ── 主張清單 ── */
        #claims-container { display: flex; flex-direction: column; gap: 24px; }

        /* ── 主張卡片 ── */
        .claim-card {
            background: #191919; border: 1px solid #222;
            border-radius: 12px; overflow: hidden;
        }

        .claim-header {
            display: flex; gap: 12px; align-items: flex-start;
            padding: 16px 20px 14px; border-bottom: 1px solid #1e1e1e;
        }
        .claim-num  { font-size: 11px; color: #383838; padding-top: 3px; white-space: nowrap; }
        .claim-body { flex: 1; }
        .claim-text {
            font-size: 14px; font-weight: bold; color: #eee;
            line-height: 1.55; margin-bottom: 9px;
        }
        .claim-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .badge {
            font-size: 11px; font-weight: bold; padding: 2px 10px;
            border-radius: 20px; white-space: nowrap;
        }
        .pos-bull    { background: rgba(76,175,80,0.13);   color: #66bb6a; border: 1px solid rgba(76,175,80,0.22); }
        .pos-bear    { background: rgba(244,67,54,0.11);   color: #ef5350; border: 1px solid rgba(244,67,54,0.22); }
        .pos-neutral { background: rgba(120,120,120,0.11); color: #909090; border: 1px solid rgba(120,120,120,0.18); }
        .topic-tag   { font-size: 11px; color: #4a6070; }

        /* ── 推理鏈 SVG 容器 ── */
        .claim-content { padding: 20px 20px 22px; }
        .chain-title {
            font-size: 10px; color: #383838; letter-spacing: 1.2px;
            text-transform: uppercase; margin-bottom: 14px;
        }
        .chain-scroll {
            overflow-x: auto; overflow-y: hidden;
            scrollbar-width: thin; scrollbar-color: #252525 transparent;
        }
        .chain-scroll::-webkit-scrollbar { height: 4px; }
        .chain-scroll::-webkit-scrollbar-thumb { background: #252525; border-radius: 2px; }

        /* ── 投資意涵 ── */
        .implication-block {
            background: rgba(77,184,255,0.04); border: 1px solid rgba(77,184,255,0.11);
            border-radius: 8px; padding: 11px 15px;
            display: flex; align-items: flex-start; gap: 10px; margin-top: 16px;
        }
        .impl-icon  { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
        .impl-label { font-size: 10px; color: #4db8ff; font-weight: bold; margin-bottom: 3px; letter-spacing: 0.5px; }
        .impl-text  { font-size: 13px; color: #aaa; line-height: 1.5; }

        /* ── Loading ── */
        #loading-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(20,20,20,0.72); z-index: 100;
            align-items: center; justify-content: center; flex-direction: column; gap: 14px;
        }
        #loading-overlay.visible { display: flex; }
        #loading-overlay p { color: #555; font-size: 13px; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid #1e1e1e; border-top-color: #4db8ff;
            border-radius: 50%; animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="topbar">
    <h1>🎙 主張與推理分析</h1>
    <select id="episode-select">
        <option value="">— 選擇集數 —</option>
    </select>
    <button id="btn-analyze" disabled>分析</button>
    <span id="status-msg">載入中...</span>
</div>

<div id="main">
    <div id="placeholder">
        <div class="icon">🎧</div>
        <div>選擇一集 Podcast，AI 將還原主持人的投資推理鏈</div>
    </div>

    <div id="episode-header">
        <div id="episode-title"></div>
        <div id="episode-meta"></div>
    </div>
    <div id="error-msg"></div>
    <div id="claims-container"></div>
</div>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p>AI 正在比對逐字稿，還原推理鏈...</p>
</div>

<script>
(() => {
    const select    = document.getElementById("episode-select");
    const btnAna    = document.getElementById("btn-analyze");
    const statusMsg = document.getElementById("status-msg");
    const ph        = document.getElementById("placeholder");
    const epHeader  = document.getElementById("episode-header");
    const epTitle   = document.getElementById("episode-title");
    const epMeta    = document.getElementById("episode-meta");
    const errEl     = document.getElementById("error-msg");
    const container = document.getElementById("claims-container");
    const loading   = document.getElementById("loading-overlay");

    const POS = {
        "多方": { label: "多方 ↑", cls: "pos-bull" },
        "空方": { label: "空方 ↓", cls: "pos-bear" },
        "中性": { label: "中性",   cls: "pos-neutral" },
    };

    // ── 載入摘要清單 ──
    fetch("/api/knowledge-graph/episodes/")
        .then(r => r.json())
        .then(d => {
            const list = d.episodes || [];
            list.forEach(ep => {
                const o = document.createElement("option");
                o.value = ep.id;
                const parts = [
                    ep.published_at,
                    ep.podcaster ? `[${ep.podcaster}]` : "",
                    ep.source_filename,
                    ep.arg_count ? `(${ep.arg_count}個論點)` : "",
                ].filter(Boolean);
                o.textContent = parts.join("  ");
                select.appendChild(o);
            });
            statusMsg.textContent = `共 ${list.length} 集`;
            btnAna.disabled = false;
        })
        .catch(e => { statusMsg.textContent = `❌ ${e.message}`; });

    select.addEventListener("change", () => { btnAna.disabled = !select.value; });

    // ── 分析 ──
    btnAna.addEventListener("click", () => {
        if (!select.value) return;
        container.innerHTML = "";
        errEl.classList.remove("visible");
        epHeader.classList.remove("visible");
        ph.style.display = "none";
        loading.classList.add("visible");
        btnAna.disabled = true;
        statusMsg.textContent = "分析中...";

        fetch("/api/knowledge-graph/analyze-episode/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ episode_id: parseInt(select.value) }),
        })
        .then(r => r.json())
        .then(data => {
            loading.classList.remove("visible");
            btnAna.disabled = false;

            if (data.error) {
                errEl.textContent = `❌ ${data.error}`;
                errEl.classList.add("visible");
                statusMsg.textContent = "失敗";
                return;
            }
            if (data.episode) {
                epTitle.textContent = data.episode.source_filename || data.episode.title || "";
                const meta = [data.episode.podcaster, data.episode.published_at].filter(Boolean).join("  ·  ");
                epMeta.textContent = meta;
                epHeader.classList.add("visible");
            }
            const claims = data.claims || [];
            if (!claims.length) {
                errEl.textContent = "未能萃取到有效推理鏈，請嘗試其他集數。";
                errEl.classList.add("visible");
                statusMsg.textContent = "完成（無結果）";
                return;
            }
            statusMsg.textContent = `完成，共 ${claims.length} 條推理鏈`;
            renderClaims(claims);
        })
        .catch(e => {
            loading.classList.remove("visible");
            btnAna.disabled = false;
            errEl.textContent = `❌ ${e.message}`;
            errEl.classList.add("visible");
            statusMsg.textContent = "失敗";
        });
    });

    // ────────────────────────────────────────────
    // 渲染主張卡片
    // ────────────────────────────────────────────
    function renderClaims(claims) {
        container.innerHTML = "";
        claims.forEach((c, idx) => {
            const pos = POS[c.position] || { label: c.position || "—", cls: "pos-neutral" };

            const card = document.createElement("div");
            card.className = "claim-card";

            const chainSvg = buildChainSVG(c.chain || []);

            const implHtml = c.investment_implication
                ? `<div class="implication-block">
                       <div class="impl-icon">💡</div>
                       <div>
                           <div class="impl-label">投資意涵</div>
                           <div class="impl-text">${esc(c.investment_implication)}</div>
                       </div>
                   </div>` : "";

            card.innerHTML = `
                <div class="claim-header">
                    <div class="claim-num">主張 ${idx + 1}</div>
                    <div class="claim-body">
                        <div class="claim-text">${esc(c.summary || c.claim || "")}</div>
                        <div class="claim-meta">
                            <span class="badge ${pos.cls}">${pos.label}</span>
                            ${c.topic ? `<span class="topic-tag">📌 ${esc(c.topic)}</span>` : ""}
                        </div>
                    </div>
                </div>
                <div class="claim-content">
                    ${(c.chain || []).length ? `<div class="chain-title">推理鏈</div>
                    <div class="chain-scroll">${chainSvg}</div>` : ""}
                    ${implHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ────────────────────────────────────────────
    // SVG 推理鏈：圓形節點 + 帶描述文字的箭頭
    // ────────────────────────────────────────────
    function buildChainSVG(steps) {
        if (!steps || !steps.length) return "";

        // 收集節點（去重相鄰重複）
        const rawNodes = [];
        steps.forEach((s, i) => {
            if (i === 0) rawNodes.push(s.source || "");
            rawNodes.push(s.target || "");
        });

        const N        = rawNodes.length;
        const R        = 30;          // 節點半徑
        const FONT_SZ  = 12;          // 節點文字大小
        const EDGE_MIN = 160;         // 邊的最小寬度（影響 label 空間）
        const PAD_X    = 44;
        const NODE_Y   = 80;          // 節點中心 Y
        const LABEL_Y  = NODE_Y - 38; // label 文字頂端 Y（節點上方）
        const FONT_EDGE= 11;          // label 文字大小

        // 計算每條邊需要的寬度（label 越長邊越寬）
        const edgeWidths = steps.map(s => {
            const chars = (s.label || "").length;
            return Math.max(EDGE_MIN, chars * 6.5 + 40);
        });

        // 計算每個節點的 X 中心
        const nodeX = [PAD_X + R];
        steps.forEach((_, i) => {
            nodeX.push(nodeX[i] + edgeWidths[i]);
        });

        const svgW = nodeX[N - 1] + R + PAD_X;
        const svgH = NODE_Y + R + 28; // 節點 + 名稱文字下方空間

        const ARROW_ID = `arr-${Math.random().toString(36).slice(2, 7)}`;

        let out = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="display:block">
  <defs>
    <marker id="${ARROW_ID}" viewBox="0 -5 10 10" refX="9" refY="0"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,-5L10,0L0,5" fill="#3a3a3a"/>
    </marker>
  </defs>
`;

        // ── 邊（線 + label 文字）──
        steps.forEach((step, i) => {
            const x1  = nodeX[i]     + R;
            const x2  = nodeX[i + 1] - R - 6; // 留給箭頭頭部
            const mx  = (x1 + x2) / 2;
            const lbl = step.label || "";

            // 水平線 + 箭頭
            out += `  <line x1="${x1}" y1="${NODE_Y}" x2="${x2}" y2="${NODE_Y}"
    stroke="#2e2e2e" stroke-width="1.5" marker-end="url(#${ARROW_ID})"/>\n`;

            // Label：分行顯示（每行最多 18 字）
            if (lbl) {
                const lines = wrapText(lbl, 18);
                const lineH = FONT_EDGE + 3;
                const totalH = lines.length * lineH;
                const startY = LABEL_Y + (2 - lines.length) * lineH; // 靠底對齊
                lines.forEach((ln, li) => {
                    out += `  <text x="${mx}" y="${startY + li * lineH}"
    text-anchor="middle" fill="#555" font-size="${FONT_EDGE}"
    font-family="PingFang TC,Microsoft JhengHei,sans-serif">${escSvg(ln)}</text>\n`;
                });
            }
        });

        // ── 節點（圓 + 文字）──
        rawNodes.forEach((name, i) => {
            const cx = nodeX[i];

            out += `  <circle cx="${cx}" cy="${NODE_Y}" r="${R}"
    fill="#1a1a1a" stroke="#3d6e94" stroke-width="1.8"/>\n`;

            // 節點名稱：分行填入圓內
            const nameLines = wrapText(name, 5);
            const nameLineH = FONT_SZ + 2;
            const nameTotalH = nameLines.length * nameLineH;
            const nameStartY = NODE_Y - nameTotalH / 2 + FONT_SZ * 0.35;

            nameLines.forEach((ln, li) => {
                out += `  <text x="${cx}" y="${nameStartY + li * nameLineH}"
    text-anchor="middle" fill="#c8dff0" font-size="${FONT_SZ}" font-weight="bold"
    font-family="PingFang TC,Microsoft JhengHei,sans-serif">${escSvg(ln)}</text>\n`;
            });
        });

        out += `</svg>`;
        return out;
    }

    // ── 工具 ──

    /** 依 maxLen 切分文字為多行（中文按字切） */
    function wrapText(text, maxLen) {
        if (!text) return [];
        if (text.length <= maxLen) return [text];
        const lines = [];
        let cur = "";
        for (const ch of text) {
            cur += ch;
            if (cur.length >= maxLen) { lines.push(cur); cur = ""; }
        }
        if (cur) lines.push(cur);
        return lines;
    }

    function esc(s) {
        return String(s || "")
            .replace(/&/g,"&amp;").replace(/</g,"&lt;")
            .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function escSvg(s) {
        return String(s || "")
            .replace(/&/g,"&amp;").replace(/</g,"&lt;")
            .replace(/>/g,"&gt;");
    }
})();
</script>
</body>
</html>
