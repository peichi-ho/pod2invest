<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產業知識圖譜</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── 頂部控制列 ── */
        #control-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.85);
            border-bottom: 1px solid #333;
            backdrop-filter: blur(6px);
            flex-wrap: wrap;
        }

        #control-bar .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #control-bar label {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
        }

        #control-bar input[type="text"],
        #control-bar input[type="date"] {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            padding: 6px 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        #control-bar input[type="text"] { width: 160px; }
        #control-bar input[type="date"] { width: 140px; cursor: pointer; }

        #control-bar input:focus { border-color: #4db8ff; }

        #control-bar input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
            cursor: pointer;
        }

        #btn-query {
            padding: 7px 20px;
            background: #1a6fb5;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #btn-query:hover { background: #2585d4; }
        #btn-query:disabled { background: #444; cursor: not-allowed; }

        #status-msg {
            font-size: 12px;
            color: #666;
            margin-left: auto;
            white-space: nowrap;
        }

        /* ── 圖表區 ── */
        #chart-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #chart-container svg { display: block; }

        /* ── Loading 遮罩 ── */
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(26,26,26,0.75);
            font-size: 18px;
            color: #888;
            z-index: 50;
        }
        #loading.hidden { display: none; }

        /* ── 空資料提示 ── */
        #empty-msg {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #666;
        }
        #empty-msg.visible { display: flex; }

        /* ── Tooltip ── */
        #tooltip {
            position: absolute;
            padding: 12px;
            background: rgba(20, 20, 20, 0.97);
            border: 1px solid #555;
            border-radius: 8px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            display: none;
            z-index: 100;
            max-width: 320px;
        }
        .tooltip-title {
            font-weight: bold;
            color: #4db8ff;
            margin-bottom: 6px;
            padding-bottom: 5px;
            border-bottom: 1px solid #444;
            font-size: 14px;
        }
        .reason-list {
            margin: 4px 0 0 16px;
            color: #ccc;
        }
        .reason-list li { margin-bottom: 3px; }

        /* ── 連線 Hover 高亮 ── */
        .link-group:hover .link {
            stroke-opacity: 1 !important;
            stroke: #fff !important;
        }

        /* ── 圖例 ── */
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.65);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            border: 1px solid #383838;
        }
        .legend-title {
            color: #888;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- 控制列 -->
    <div id="control-bar">
        <div class="ctrl-group">
            <label for="input-industry">產業關鍵字</label>
            <input type="text" id="input-industry" placeholder="不填表示全部產業">
        </div>
        <div class="ctrl-group">
            <label for="input-start">開始日期</label>
            <input type="date" id="input-start">
        </div>
        <div class="ctrl-group">
            <label for="input-end">結束日期</label>
            <input type="date" id="input-end">
        </div>
        <button id="btn-query">查詢</button>
        <span id="status-msg">預設顯示最近 7 天</span>
    </div>

    <!-- 圖表區 -->
    <div id="chart-container">
        <div id="loading">載入圖譜資料中...</div>
        <div id="empty-msg">無符合條件的資料</div>
        <div id="tooltip"></div>

        <div id="legend">
            <div class="legend-title">關係類型（連線粗細 = 提及次數）</div>
            <div class="legend-item"><div class="legend-dot" style="background:#4CAF50"></div>供應 Supply</div>
            <div class="legend-item"><div class="legend-dot" style="background:#F44336"></div>競爭替代 Substitution</div>
            <div class="legend-item"><div class="legend-dot" style="background:#2196F3"></div>趨勢共生 Co-impact</div>
            <div class="legend-item"><div class="legend-dot" style="background:#999"></div>其他 Unknown</div>
        </div>
    </div>

    <script>
    (() => {
        // ── 常數 ──
        const RELATION_COLORS = {
            "Supply":       "#4CAF50",
            "Substitution": "#F44336",
            "Co-impact":    "#2196F3",
            "Unknown":      "#999999",
        };
        const colorScale = d3.scaleOrdinal(d3.schemeTableau10);

        // ── 初始化 SVG ──
        const container = document.getElementById("chart-container");
        let width  = container.clientWidth;
        let height = container.clientHeight;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // 箭頭 defs（一次性）
        const defs = svg.append("defs");
        Object.entries(RELATION_COLORS).forEach(([type, color]) => {
            defs.append("marker")
                .attr("id", `marker-${type}`)
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 30)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("fill", color)
                .attr("d", "M0,-5L10,0L0,5");
        });

        const g = svg.append("g");
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        // ── 狀態 ──
        let simulation = null;

        // ── UI refs ──
        const loadingEl  = document.getElementById("loading");
        const emptyEl    = document.getElementById("empty-msg");
        const statusMsg  = document.getElementById("status-msg");
        const btnQuery   = document.getElementById("btn-query");
        const tooltip    = d3.select("#tooltip");

        // ── 讓 Tooltip 跟隨滑鼠 ──
        svg.on("mousemove", (event) => {
            tooltip
                .style("left", (event.pageX + 18) + "px")
                .style("top",  (event.pageY - 18) + "px");
        });

        // ── Tooltip helpers ──
        function showNodeTooltip(event, d) {
            d3.select(this).transition().duration(150).attr("r", 28);
            tooltip.style("display", "block").html(`
                <div class="tooltip-title">${d.id}</div>
                <div><b>所屬產業：</b>
                    <span style="color:${colorScale(d.industry)}">${d.industry}</span>
                </div>
            `);
        }

        function showLinkTooltip(event, d) {
            const reasonsHtml = (d.reasons && d.reasons.length > 0)
                ? `<ul class="reason-list">${d.reasons.map(r => `<li>${r}</li>`).join("")}</ul>`
                : `<span style="color:#888">無詳細敘述</span>`;
            tooltip.style("display", "block").html(`
                <div class="tooltip-title">${d.source.id ?? d.source} ➔ ${d.target.id ?? d.target}</div>
                <div style="margin-bottom:4px">
                    <b>關係：</b>
                    <span style="color:${RELATION_COLORS[d.relation_type] ?? RELATION_COLORS.Unknown}">
                        ${d.relation_type}
                    </span>
                </div>
                <div style="margin-bottom:4px"><b>提及次數：</b>${d.weight} 次</div>
                <div><b>關聯事件：</b></div>
                ${reasonsHtml}
            `);
        }

        function hideTooltip() {
            d3.selectAll(".node circle").transition().duration(150).attr("r", 22);
            tooltip.style("display", "none");
        }

        // ── 主繪圖函式 ──
        function renderGraph(data) {
            // 停掉舊的 simulation
            if (simulation) simulation.stop();

            // 清空舊圖層
            g.selectAll("*").remove();

            if (!data.nodes || data.nodes.length === 0) {
                emptyEl.classList.add("visible");
                return;
            }
            emptyEl.classList.remove("visible");

            // 更新 SVG 尺寸（以防視窗曾 resize）
            width  = container.clientWidth;
            height = container.clientHeight;
            svg.attr("width", width).attr("height", height);

            // ── 連線組 ──
            const linkGroup = g.append("g")
                .selectAll(".link-group")
                .data(data.links)
                .enter().append("g")
                .attr("class", "link-group")
                .on("mouseover", showLinkTooltip)
                .on("mouseout", hideTooltip);

            const link = linkGroup.append("line")
                .attr("class", "link")
                .attr("fill", "none")
                .attr("stroke-opacity", 0.65)
                .attr("stroke", d => RELATION_COLORS[d.relation_type] ?? RELATION_COLORS.Unknown)
                .attr("stroke-width", d => Math.max(2, (d.weight ?? 1) * 1.8))
                .attr("marker-end", d => `url(#marker-${d.relation_type})`);

            // 透明感應區
            linkGroup.append("line")
                .attr("fill", "none")
                .attr("stroke", "transparent")
                .attr("stroke-width", 20)
                .style("cursor", "help");

            // ── 節點組 ──
            const node = g.append("g")
                .selectAll(".node")
                .data(data.nodes)
                .enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", (e, d) => {
                        if (!e.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on("end",   (e, d) => {
                        if (!e.active) simulation.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    })
                );

            node.append("circle")
                .attr("r", 22)
                .attr("fill", d => colorScale(d.industry ?? "未分類"))
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5)
                .style("cursor", "pointer")
                .on("mouseover", showNodeTooltip)
                .on("mouseout", hideTooltip);

            node.append("text")
                .attr("dy", 40)
                .attr("text-anchor", "middle")
                .attr("font-size", "13px")
                .attr("font-weight", "bold")
                .attr("fill", "#eee")
                .style("pointer-events", "none")
                .style("text-shadow", "1px 1px 2px #000")
                .text(d => d.id);

            // ── 力模擬 ──
            simulation = d3.forceSimulation(data.nodes)
                .force("link", d3.forceLink(data.links).id(d => d.id).distance(240))
                .force("charge", d3.forceManyBody().strength(-700))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(60))
                .force("x", d3.forceX(width / 2).strength(0.04))
                .force("y", d3.forceY(height / 2).strength(0.04));

            const r = 30;
            simulation.on("tick", () => {
                data.nodes.forEach(d => {
                    d.x = Math.max(r, Math.min(width  - r, d.x));
                    d.y = Math.max(r, Math.min(height - r, d.y));
                });

                // 更新連線（link group 包含兩條 line：實線 + 感應區）
                linkGroup.selectAll("line")
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        // ── 取得資料 ──
        function fetchAndRender() {
            const industry  = document.getElementById("input-industry").value.trim();
            const startDate = document.getElementById("input-start").value;
            const endDate   = document.getElementById("input-end").value;

            const params = new URLSearchParams();
            if (industry)  params.set("industry",   industry);
            if (startDate) params.set("start_date", startDate);
            if (endDate)   params.set("end_date",   endDate);

            const queryStr = params.toString();
            const url = `/api/knowledge-graph/graph-data/${queryStr ? "?" + queryStr : ""}`;

            // 更新狀態列文字
            const labels = [];
            if (industry)          labels.push(`產業：${industry}`);
            if (startDate || endDate) {
                labels.push(`${startDate || "最早"} ～ ${endDate || "最新"}`);
            } else {
                labels.push("最近 7 天");
            }
            statusMsg.textContent = labels.join("　");

            // 顯示 loading
            loadingEl.classList.remove("hidden");
            emptyEl.classList.remove("visible");
            btnQuery.disabled = true;

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    loadingEl.classList.add("hidden");
                    btnQuery.disabled = false;
                    renderGraph(data);
                })
                .catch(err => {
                    loadingEl.classList.add("hidden");
                    btnQuery.disabled = false;
                    statusMsg.textContent = `❌ 查詢失敗：${err.message}`;
                    console.error(err);
                });
        }

        // ── 事件綁定 ──
        btnQuery.addEventListener("click", fetchAndRender);

        // Enter 鍵觸發查詢
        document.getElementById("input-industry").addEventListener("keydown", e => {
            if (e.key === "Enter") fetchAndRender();
        });

        // ── 視窗縮放 ──
        window.addEventListener("resize", () => {
            width  = container.clientWidth;
            height = container.clientHeight;
            svg.attr("width", width).attr("height", height);
        });

        // ── 初始載入（預設最近 7 天、不限產業）──
        fetchAndRender();
    })();
    </script>
</body>
</html>
