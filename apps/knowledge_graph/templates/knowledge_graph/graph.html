<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產業知識圖譜</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── 頂部控制列 ── */
        #control-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 20px;
            background: rgba(10, 10, 10, 0.85);
            border-bottom: 1px solid #333;
            backdrop-filter: blur(6px);
            flex-wrap: wrap;
        }

        #control-bar .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #control-bar label {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
        }

        #control-bar input[type="text"],
        #control-bar input[type="date"] {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            padding: 6px 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        #control-bar input[type="text"] { width: 160px; }
        #control-bar input[type="date"] { width: 140px; cursor: pointer; }

        #control-bar select {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            padding: 6px 10px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
            max-width: 140px;
        }
        #control-bar select:focus { border-color: #4db8ff; }
        #control-bar select option { background: #2a2a2a; }

        #control-bar input:focus { border-color: #4db8ff; }

        #control-bar input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
            cursor: pointer;
        }

        #btn-query {
            padding: 7px 20px;
            background: #1a6fb5;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #btn-query:hover { background: #2585d4; }
        #btn-query:disabled { background: #444; cursor: not-allowed; }

        #status-msg {
            font-size: 12px;
            color: #666;
            margin-left: auto;
            white-space: nowrap;
        }

        /* ── 圖表區 ── */
        #chart-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #chart-container svg { display: block; }

        /* ── Loading 遮罩 ── */
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(26,26,26,0.75);
            font-size: 18px;
            color: #888;
            z-index: 50;
        }
        #loading.hidden { display: none; }

        /* ── 空資料提示 ── */
        #empty-msg {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #666;
        }
        #empty-msg.visible { display: flex; }

        /* ── Tooltip ── */
        #tooltip {
            position: absolute;
            padding: 12px;
            background: rgba(20, 20, 20, 0.97);
            border: 1px solid #555;
            border-radius: 8px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            display: none;
            z-index: 100;
            max-width: 320px;
        }
        .tooltip-title {
            font-weight: bold;
            color: #4db8ff;
            margin-bottom: 6px;
            padding-bottom: 5px;
            border-bottom: 1px solid #444;
            font-size: 14px;
        }
        .reason-list {
            margin: 4px 0 0 16px;
            color: #ccc;
        }
        .reason-list li { margin-bottom: 3px; }

        /* ── 連線 Hover 高亮 ── */
        .link-group:hover .link {
            stroke-opacity: 1 !important;
            stroke: #fff !important;
        }

        /* ── 圖例 ── */
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.65);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            border: 1px solid #383838;
        }
        .legend-title {
            color: #888;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ── AI 解讀面板 ── */
        #narrative-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 320px;
            max-height: calc(100vh - 120px);
            background: rgba(10, 10, 10, 0.92);
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            transition: width 0.25s ease, opacity 0.25s ease;
            z-index: 50;
        }
        #narrative-panel.collapsed {
            width: 42px;
            overflow: hidden;
        }
        #narrative-panel.collapsed #narrative-header-title,
        #narrative-panel.collapsed #narrative-body {
            display: none;
        }
        #narrative-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            flex-shrink: 0;
            user-select: none;
        }
        #narrative-header-title {
            font-size: 13px;
            font-weight: bold;
            color: #4db8ff;
            white-space: nowrap;
        }
        #narrative-toggle-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }
        #narrative-body {
            overflow-y: auto;
            padding: 12px 14px;
            flex: 1;
        }
        #narrative-body::-webkit-scrollbar { width: 4px; }
        #narrative-body::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        #narrative-loading {
            color: #666;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
            display: none;
        }
        #narrative-text {
            font-size: 13px;
            line-height: 1.8;
            color: #ccc;
            white-space: pre-wrap;
        }
        #narrative-filter-label {
            font-size: 11px;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- 控制列 -->
    <div id="control-bar">
        <div class="ctrl-group">
            <label for="input-industry">產業 / 公司名稱</label>
            <input type="text" id="input-industry" placeholder="不填表示全部">
            <select id="select-industry">
                <option value="">-- 快速選擇產業 --</option>
            </select>
        </div>
        <div class="ctrl-group">
            <label for="input-start">開始日期</label>
            <input type="date" id="input-start">
        </div>
        <div class="ctrl-group">
            <label for="input-end">結束日期</label>
            <input type="date" id="input-end">
        </div>
        <button id="btn-query">查詢</button>
        <span id="date-hint" style="font-size:11px; color:#666; white-space:nowrap;">（最多 7 天）</span>
        <span id="status-msg">預設顯示資料庫最新 7 天</span>
    </div>

    <!-- 圖表區 -->
    <div id="chart-container">
        <div id="loading">載入圖譜資料中...</div>
        <div id="empty-msg">無符合條件的資料</div>
        <div id="tooltip"></div>

        <!-- AI 解讀面板 -->
        <div id="narrative-panel">
            <div id="narrative-header">
                <button id="narrative-toggle-btn" title="收合/展開">◀</button>
                <span id="narrative-header-title">✦ AI 圖譜解讀</span>
            </div>
            <div id="narrative-body">
                <div id="narrative-filter-label"></div>
                <div id="narrative-loading">AI 解讀生成中...</div>
                <div id="narrative-text"></div>
            </div>
        </div>

        <div id="legend">
            <div class="legend-title" style="margin-bottom:10px;">節點顏色 = 連線熱度</div>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                <span style="font-size:11px; color:#aaa;">少</span>
                <div style="width:100px; height:12px; border-radius:4px;
                    background: linear-gradient(to right, #ffffb2, #fecc5c, #fd8d3c, #f03b20, #bd0026);"></div>
                <span style="font-size:11px; color:#aaa;">多</span>
            </div>
            <div class="legend-title" style="margin-top:12px; margin-bottom:8px;">連線顏色 = 關係類型（粗細 = 提及次數）</div>
           
        </div>
    </div>

    <script>
    (() => {
        // ── 常數 ──
        const RELATION_COLORS = {
            "Supply":       "#4CAF50",
            "Substitution": "#F44336",
            "Co-impact":    "#2196F3",
            "Unknown":      "#999999",
        };
        // 節點熱度色階：連線數少 → 冷藍，連線數多 → 暖紅
        // domain 會在每次 renderGraph 時依實際資料動態設定
        let nodeColorScale = d3.scaleSequential(d3.interpolateYlOrRd);

        // ── 初始化 SVG ──
        const container = document.getElementById("chart-container");
        let width  = container.clientWidth;
        let height = container.clientHeight;

        const svg = d3.select("#chart-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // 箭頭 defs（一次性）
        const defs = svg.append("defs");
        Object.entries(RELATION_COLORS).forEach(([type, color]) => {
            defs.append("marker")
                .attr("id", `marker-${type}`)
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 30)
                .attr("refY", 0)
                .attr("markerUnits", "userSpaceOnUse")
                .attr("markerWidth", 10)
                .attr("markerHeight", 10)
                .attr("orient", "auto")
                .append("path")
                .attr("fill", color)
                .attr("d", "M0,-5L10,0L0,5");
        });

        const g = svg.append("g");
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        // ── 狀態 ──
        let simulation = null;
        let maxDate = null;   // 資料庫最新日期（YYYY-MM-DD）

        // ── 日期工具函式 ──
        function addDays(dateStr, days) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + days);
            const yy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        function diffDays(startStr, endStr) {
            const s = new Date(startStr);
            const e = new Date(endStr);
            return Math.round((e - s) / 86400000);
        }

        // ── UI refs ──
        const loadingEl  = document.getElementById("loading");
        const emptyEl    = document.getElementById("empty-msg");
        const statusMsg  = document.getElementById("status-msg");
        const dateHint   = document.getElementById("date-hint");
        const btnQuery   = document.getElementById("btn-query");
        const inputStart = document.getElementById("input-start");
        const inputEnd   = document.getElementById("input-end");
        const tooltip    = d3.select("#tooltip");

        // ── 日期輸入事件：只更新提示，不自動修正 ──
        inputStart.addEventListener("change", updateDateHint);
        inputEnd.addEventListener("change", () => {
            if (maxDate && inputEnd.value > maxDate) inputEnd.value = maxDate;
            updateDateHint();
        });

        function updateDateHint() {
            if (inputStart.value && inputEnd.value) {
                const span = diffDays(inputStart.value, inputEnd.value) + 1;
                const over = span > 7;
                dateHint.textContent = over ? `⚠ 超過 7 天（${span} 天）` : `（${span} 天）`;
                dateHint.style.color = over ? "#f87171" : "#666";
            } else {
                dateHint.textContent = "（最多 7 天）";
                dateHint.style.color = "#666";
            }
        }

        // ── 讓 Tooltip 跟隨滑鼠 ──
        svg.on("mousemove", (event) => {
            tooltip
                .style("left", (event.pageX + 18) + "px")
                .style("top",  (event.pageY - 18) + "px");
        });

        // ── Tooltip helpers ──
        function showNodeTooltip(event, d) {
            d3.select(this).transition().duration(150).attr("r", 28);
            const deg = degreeMap[d.id] ?? 0;
            tooltip.style("display", "block").html(`
                <div class="tooltip-title">${d.id}</div>
                <div><b>所屬產業：</b> ${d.industry ?? "未分類"}</div>
                <div><b>連線數（熱度）：</b>
                    <span style="color:${nodeColorScale(deg)}">${deg} 條</span>
                </div>
            `);
        }

        function showLinkTooltip(event, d) {
            const reasonsHtml = (d.reasons && d.reasons.length > 0)
                ? `<ul class="reason-list">${d.reasons.map(r => `<li>${r}</li>`).join("")}</ul>`
                : `<span style="color:#888">無詳細敘述</span>`;
            tooltip.style("display", "block").html(`
                <div class="tooltip-title">${d.source.id ?? d.source} ➔ ${d.target.id ?? d.target}</div>
                <div style="margin-bottom:4px">
                    <b>關係：</b>
                    <span style="color:${RELATION_COLORS[d.relation_type] ?? RELATION_COLORS.Unknown}">
                        ${d.relation_type}
                    </span>
                </div>
                <div style="margin-bottom:4px"><b>提及次數：</b>${d.weight} 次</div>
                <div><b>關聯事件：</b></div>
                ${reasonsHtml}
            `);
        }

        function hideTooltip() {
            d3.selectAll(".node circle").transition().duration(150).attr("r", 22);
            tooltip.style("display", "none");
        }

        // ── 主繪圖函式 ──
        function renderGraph(data) {
            // 停掉舊的 simulation
            if (simulation) simulation.stop();

            // 清空舊圖層
            g.selectAll("*").remove();

            if (!data.nodes || data.nodes.length === 0) {
                emptyEl.classList.add("visible");
                return;
            }
            emptyEl.classList.remove("visible");

            // 更新 SVG 尺寸（以防視窗曾 resize）
            width  = container.clientWidth;
            height = container.clientHeight;
            svg.attr("width", width).attr("height", height);

            // ── 連線組 ──
            const linkGroup = g.append("g")
                .selectAll(".link-group")
                .data(data.links)
                .enter().append("g")
                .attr("class", "link-group")
                .on("mouseover", showLinkTooltip)
                .on("mouseout", hideTooltip);

            const link = linkGroup.append("line")
                .attr("class", "link")
                .attr("fill", "none")
                .attr("stroke-opacity", 0.65)
                .attr("stroke", d => RELATION_COLORS[d.relation_type] ?? RELATION_COLORS.Unknown)
                .attr("stroke-width", d => Math.max(2, (d.weight ?? 1) * 1.8))
                .attr("marker-end", d => `url(#marker-${d.relation_type})`);

            // 透明感應區
            linkGroup.append("line")
                .attr("fill", "none")
                .attr("stroke", "transparent")
                .attr("stroke-width", 20)
                .style("cursor", "help");

            // ── 計算每個節點的連線數（degree）並建立色階 ──
            const degreeMap = {};
            data.nodes.forEach(d => { degreeMap[d.id] = 0; });
            data.links.forEach(l => {
                const s = typeof l.source === "object" ? l.source.id : l.source;
                const t = typeof l.target === "object" ? l.target.id : l.target;
                if (degreeMap[s] !== undefined) degreeMap[s]++;
                if (degreeMap[t] !== undefined) degreeMap[t]++;
            });
            const maxDegree = Math.max(20, ...Object.values(degreeMap));
            nodeColorScale = d3.scaleSequential(d3.interpolateYlOrRd).domain([0, maxDegree]);

            // ── 節點組 ──
            const node = g.append("g")
                .selectAll(".node")
                .data(data.nodes)
                .enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", (e, d) => {
                        if (!e.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on("end",   (e, d) => {
                        if (!e.active) simulation.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    })
                );

            node.append("circle")
                .attr("r", 22)
                .attr("fill", d => nodeColorScale(degreeMap[d.id] ?? 0))
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5)
                .style("cursor", "pointer")
                .on("mouseover", showNodeTooltip)
                .on("mouseout", hideTooltip);

            node.append("text")
                .attr("dy", 40)
                .attr("text-anchor", "middle")
                .attr("font-size", "13px")
                .attr("font-weight", "bold")
                .attr("fill", "#eee")
                .style("pointer-events", "none")
                .style("text-shadow", "1px 1px 2px #000")
                .text(d => d.id);

            // ── 力模擬 ──
            simulation = d3.forceSimulation(data.nodes)
                .force("link", d3.forceLink(data.links).id(d => d.id).distance(240))
                .force("charge", d3.forceManyBody().strength(-700))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(60))
                .force("x", d3.forceX(width / 2).strength(0.04))
                .force("y", d3.forceY(height / 2).strength(0.04));

            const r = 30;
            simulation.on("tick", () => {
                data.nodes.forEach(d => {
                    d.x = Math.max(r, Math.min(width  - r, d.x));
                    d.y = Math.max(r, Math.min(height - r, d.y));
                });

                // 更新連線（link group 包含兩條 line：實線 + 感應區）
                linkGroup.selectAll("line")
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        // ── 取得資料 ──
        function fetchAndRender() {
            const industry  = document.getElementById("input-industry").value.trim();
            const startDate = inputStart.value;
            const endDate   = inputEnd.value;

            // 驗證時間跨度不超過 7 天
            if (startDate && endDate && diffDays(startDate, endDate) > 6) {
                statusMsg.textContent = "⚠ 時間跨度不可超過 7 天，請重新選擇";
                return;
            }

            const params = new URLSearchParams();
            if (industry)  params.set("industry",   industry);
            if (startDate) params.set("start_date", startDate);
            if (endDate)   params.set("end_date",   endDate);

            const queryStr = params.toString();
            const url = `/api/knowledge-graph/graph-data/${queryStr ? "?" + queryStr : ""}`;

            // 更新狀態列文字
            const labels = [];
            if (industry)          labels.push(`關鍵字：${industry}`);
            if (startDate || endDate) {
                labels.push(`${startDate || "最早"} ～ ${endDate || "最新"}`);
            } else {
                labels.push("資料庫最新 7 天");
            }
            statusMsg.textContent = labels.join("　");

            // 顯示 loading
            loadingEl.classList.remove("hidden");
            emptyEl.classList.remove("visible");
            btnQuery.disabled = true;

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    loadingEl.classList.add("hidden");
                    btnQuery.disabled = false;
                    renderGraph(data);
                    // 圖渲染完後，用同一份資料呼叫 AI 解讀
                    fetchNarrative(data, { industry, startDate, endDate });
                })
                .catch(err => {
                    loadingEl.classList.add("hidden");
                    btnQuery.disabled = false;
                    statusMsg.textContent = `❌ 查詢失敗：${err.message}`;
                    console.error(err);
                });
        }

        // ── AI 圖譜解讀 ──
        const narrativePanel   = document.getElementById("narrative-panel");
        const narrativeLoading = document.getElementById("narrative-loading");
        const narrativeText    = document.getElementById("narrative-text");
        const narrativeFilter  = document.getElementById("narrative-filter-label");
        const narrativeToggle  = document.getElementById("narrative-toggle-btn");

        narrativeToggle.addEventListener("click", () => {
            const collapsed = narrativePanel.classList.toggle("collapsed");
            narrativeToggle.textContent = collapsed ? "▶" : "◀";
        });

        function fetchNarrative(graphData, filters) {
            // 更新面板的 filter 標籤
            const parts = [];
            if (filters.industry)  parts.push(`關鍵字：${filters.industry}`);
            if (filters.startDate || filters.endDate) {
                parts.push(`${filters.startDate || "最早"} ～ ${filters.endDate || "最新"}`);
            } else {
                parts.push("最近 7 天");
            }
            narrativeFilter.textContent = parts.join("　");

            // 展開面板並顯示 loading
            narrativePanel.classList.remove("collapsed");
            narrativeToggle.textContent = "◀";
            narrativeText.textContent = "";
            narrativeLoading.style.display = "block";

            // D3 forceLink 會把 source/target 從字串轉成物件參考，
            // 送給後端前需要還原成純字串，避免循環參考或格式錯誤
            const safeNodes = graphData.nodes.map(n => ({
                id:       n.id,
                industry: n.industry ?? "",
            }));
            const safeLinks = graphData.links.map(l => ({
                source:        typeof l.source === "object" ? l.source.id : l.source,
                target:        typeof l.target === "object" ? l.target.id : l.target,
                relation_type: l.relation_type ?? "",
                weight:        l.weight ?? 1,
                reasons:       l.reasons ?? [],
            }));

            fetch("/api/knowledge-graph/graph-narrative/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nodes:   safeNodes,
                    links:   safeLinks,
                    filters: {
                        industry:   filters.industry   || null,
                        start_date: filters.startDate  || null,
                        end_date:   filters.endDate    || null,
                    },
                }),
            })
                .then(res => res.json())
                .then(result => {
                    narrativeLoading.style.display = "none";
                    narrativeText.textContent = result.narrative || "（無法生成解讀）";
                })
                .catch(err => {
                    narrativeLoading.style.display = "none";
                    narrativeText.textContent = `❌ 解讀失敗：${err.message}`;
                });
        }

        // ── 事件綁定 ──
        btnQuery.addEventListener("click", fetchAndRender);

        // Enter 鍵觸發查詢
        document.getElementById("input-industry").addEventListener("keydown", e => {
            if (e.key === "Enter") fetchAndRender();
        });

        // 下拉選單選擇後填入文字框並觸發查詢
        const selectIndustry = document.getElementById("select-industry");
        selectIndustry.addEventListener("change", () => {
            const val = selectIndustry.value;
            document.getElementById("input-industry").value = val;
            selectIndustry.value = "";   // 選完重置回提示文字
            if (val) fetchAndRender();
        });

        // ── 載入產業清單 ──
        function loadIndustries() {
            fetch("/api/knowledge-graph/industries/")
                .then(res => res.json())
                .then(data => {
                    const list = data.industries || [];
                    list.forEach(ind => {
                        const opt = document.createElement("option");
                        opt.value = ind;
                        opt.textContent = ind;
                        selectIndustry.appendChild(opt);
                    });
                    if (list.length > 0) {
                        document.getElementById("input-industry").value = list[0];
                    }
                    fetchAndRender();
                })
                .catch(() => fetchAndRender());
        }

        // ── 初始化：先取資料庫最新日期，設定預設日期區間，再載入產業 ──
        fetch("/api/knowledge-graph/latest-date/")
            .then(res => res.json())
            .then(data => {
                maxDate = data.latest_date;
                inputStart.max = maxDate;
                inputEnd.max   = maxDate;
                inputEnd.value   = maxDate;
                inputStart.value = addDays(maxDate, -6);
                updateDateHint();
                loadIndustries();
            })
            .catch(() => {
                // 取不到最新日期時退回不限制
                loadIndustries();
            });

        // ── 視窗縮放 ──
        window.addEventListener("resize", () => {
            width  = container.clientWidth;
            height = container.clientHeight;
            svg.attr("width", width).attr("height", height);
        });
    })();
    </script>
</body>
</html>
